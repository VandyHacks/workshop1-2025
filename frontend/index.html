<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Agent</title>
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body>
		<div id="parent">
			<div id="input-box">
				<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search">
					<path d="m21 21-4.34-4.34" />
					<circle cx="11" cy="11" r="8" />
				</svg>
				<input style="color: oklch(0.7 0 0); background-color: transparent; outline: none; box-shadow: none; border: none; font-size: medium; width: 88%;" type="text" placeholder="Ask anything..." id="input"></input>
				<button id="send">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black"
						stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-icon lucide-arrow-up">
						<path d="m5 12 7-7 7 7" />
						<path d="M12 19V5" />
					</svg>
				</button>
			</div>
			<div id="chats">
				<div class="bot-message">
					<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot-icon lucide-bot">
						<path d="M12 8V4H8" />
						<rect width="16" height="12" x="4" y="8" rx="2" />
						<path d="M2 14h2" />
						<path d="M20 14h2" />
						<path d="M15 13v2" />
						<path d="M9 13v2" />
					</svg>
					<div>Hello! I'm a highly intelligent bot. How can I assist you today?</div>
				</div>
			</div>
		</div>
	</body>
	<script src="./source.js" defer></script>
</html>
